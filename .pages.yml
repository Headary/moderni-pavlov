media: src/assets

content:
  - name: main-page
    label: Hlavní stránka
    type: file
    path: src/index.md
    fields:
      - name: title
        label: Název
        type: string
        required: true
      - name: description
        label: Popisek
        description: Popisek stránky pro SEO
        type: text
      - name: body
        label: Obsah
        type: rich-text
  - name: pages
    label: Stránky
    type: collection
    path: src
    exclude: ["index.md", "404.md"]
    fields:
      - name: title
        label: Název
        type: string
        required: true
      - name: description
        label: Popisek
        description: Popisek stránky pro SEO
        type: text
      - name: body
        label: Obsah
        type: rich-text
  - name: news
    label: Novinky
    type: collection
    path: src/novinky
    fields:
      - name: title
        label: Nadpis
        type: string
        required: True
      - name: date
        label: Datum
        type: date
        required: True
        options:
          time: False
          format: yyyy-MM-dd
      - name: body
        label: Obsah
        type: rich-text
  - name: candidates
    label: Kandidáti
    type: file
    path: src/_data/candidates.json
    list: True
    fields:
      - name: name
        label: Jméno
        type: string
      - name: role
        label: Funkce
        type: string
      - name: bio
        label: Popisek
        type: text
      - name: photo
        label: Fotka
        type: image

actions:
  - name: deploy
    label: Nasadit stránky
    workflow: build-and-deploy.yml
    confirm:
      title: Nasazení stránek
      message: Opravdu chceš nasadit a zveřejnit aktuální obsah?
      button: Ano, nasadit

settings:
  commit:
    identity: app
    templates:
      create: "cms(create): {path}"
      update: "cms(update): {path}"
      delete: "cms(delete): {path}"
      rename: "cms(rename): {oldPath} -> {newPath}"
